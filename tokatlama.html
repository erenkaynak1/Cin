<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#050506">
<title>Sonred Onur Tokatlama</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:#050506;color:#fff;font-family:system-ui,-apple-system,Segoe UI,sans-serif;overscroll-behavior:none}
body{display:flex;justify-content:center}
.game{position:relative;width:min(100vw,540px);min-height:100svh;background:#050506;overflow:hidden}
.stage{position:relative;width:100%;aspect-ratio:320/569;overflow:hidden;background:#08090b;touch-action:manipulation}
.art{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;transform-origin:50% 46%;will-change:transform,filter}
.stage.hit-left .art{animation:hitLeft .34s cubic-bezier(.18,.8,.22,1)}
.stage.hit-right .art{animation:hitRight .34s cubic-bezier(.18,.8,.22,1)}
.stage.flash-left:after,.stage.flash-right:after{content:"";position:absolute;pointer-events:none;top:23%;width:30%;height:28%;border-radius:50%;filter:blur(12px);opacity:0}
.stage.flash-left:after{left:28%;background:radial-gradient(circle,rgba(255,103,46,.72),rgba(255,55,25,0) 68%);animation:flash .28s ease}
.stage.flash-right:after{right:28%;background:radial-gradient(circle,rgba(55,139,255,.72),rgba(31,92,255,0) 68%);animation:flash .28s ease}
@keyframes hitLeft{0%,100%{transform:translateX(0) rotate(0) scale(1)}35%{transform:translateX(2.8%) rotate(1.8deg) scale(1.012)}68%{transform:translateX(-1.2%) rotate(-.7deg) scale(1.006)}}
@keyframes hitRight{0%,100%{transform:translateX(0) rotate(0) scale(1)}35%{transform:translateX(-2.8%) rotate(-1.8deg) scale(1.012)}68%{transform:translateX(1.2%) rotate(.7deg) scale(1.006)}}
@keyframes flash{0%{opacity:0;transform:scale(.6)}35%{opacity:.95;transform:scale(1.12)}100%{opacity:0;transform:scale(1.45)}}
.back{position:absolute;z-index:25;left:2.5%;top:2.1%;width:12%;aspect-ratio:1;border:0;border-radius:50%;background:transparent;color:transparent;text-decoration:none}
.slap{position:absolute;z-index:25;bottom:2.1%;width:43%;height:18%;border:0;background:transparent;cursor:pointer;border-radius:50% 50% 18% 18%}
.slap.left{left:2.5%}.slap.right{right:2.5%}
.slap:active{background:radial-gradient(circle at 50% 45%,rgba(255,255,255,.18),transparent 58%)}
.speech{position:absolute;z-index:30;left:50%;top:28.5%;transform:translate(-50%,-8px) scale(.92);width:69%;padding:9px 12px;border:2px solid #f3be52;border-radius:13px;background:rgba(13,12,13,.94);box-shadow:0 0 22px rgba(255,116,35,.32);text-align:center;font-weight:900;font-size:clamp(13px,3.5vw,19px);color:#ffe2a2;opacity:0;pointer-events:none;text-shadow:0 1px 0 #000}
.speech.show{animation:say .9s ease}
@keyframes say{0%{opacity:0;transform:translate(-50%,5px) scale(.9)}12%,74%{opacity:1;transform:translate(-50%,0) scale(1)}100%{opacity:0;transform:translate(-50%,-10px) scale(.96)}}
.hit-pop{position:absolute;z-index:31;top:34%;font-size:clamp(30px,10vw,58px);font-weight:1000;opacity:0;pointer-events:none;text-shadow:0 3px 0 #111,0 0 22px currentColor}
.hit-pop.left{left:20%;color:#ff5a32}.hit-pop.right{right:20%;color:#4d9cff}
.hit-pop.go{animation:pop .36s ease}
@keyframes pop{0%{opacity:0;transform:scale(.35) rotate(-14deg)}42%{opacity:1;transform:scale(1.12) rotate(6deg)}100%{opacity:0;transform:scale(.84) translateY(-18px)}}
.stat-cover{position:absolute;z-index:12;background:linear-gradient(#161313,#0d0c0c);border-radius:4px;box-shadow:0 0 0 1px rgba(255,177,63,.12) inset}
.stat-value{position:absolute;z-index:13;font-family:Impact,Haettenschweiler,'Arial Narrow Bold',sans-serif;color:#f4eee2;line-height:1;text-align:center;text-shadow:0 2px 1px #000}
.cover-hits{left:18%;top:52.8%;width:9%;height:4.3%}.value-hits{left:18%;top:53%;width:9%;font-size:clamp(18px,5vw,31px)}
.cover-combo{left:18%;top:59.4%;width:9%;height:4.3%}.value-combo{left:18%;top:59.6%;width:9%;font-size:clamp(18px,5vw,31px)}
.damage-mask{position:absolute;z-index:12;left:7.2%;top:66%;width:20%;height:1.5%;background:#111;border-radius:2px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.12)}
.damage-fill{height:100%;width:0;background:linear-gradient(90deg,#ff2a20,#ff6a1e,#ffd24a);box-shadow:0 0 8px rgba(255,76,28,.85);transition:width .18s ease}
.stage-marker{position:absolute;z-index:14;right:3.7%;width:22.6%;border:3px solid transparent;border-radius:8px;pointer-events:none;transition:.2s ease}
.stage-marker.s1{top:22.6%;height:14.9%}.stage-marker.s2{top:38.1%;height:15%}.stage-marker.s3{top:53.6%;height:15.2%}
.stage-marker.active{border-color:#ffd06c;box-shadow:0 0 18px rgba(255,164,52,.55),inset 0 0 14px rgba(255,169,48,.12)}
.bruise{position:absolute;z-index:15;pointer-events:none;border-radius:50%;opacity:0;mix-blend-mode:multiply;transition:opacity .2s ease}
.b1{left:46.8%;top:28.4%;width:4.5%;height:2.3%;background:#69244e;transform:rotate(-18deg)}
.b2{left:52.7%;top:30%;width:5%;height:2.5%;background:#7a2432;transform:rotate(14deg)}
.b3{left:49.2%;top:31.5%;width:3.4%;height:1.2%;background:#8d241f}
.damage1 .b1{opacity:.35}.damage2 .b1,.damage2 .b2{opacity:.58}.damage3 .b1,.damage3 .b2,.damage3 .b3{opacity:.78}
.toast{position:absolute;z-index:40;left:50%;bottom:20.5%;transform:translateX(-50%) translateY(10px);padding:7px 12px;border:1px solid rgba(255,205,108,.55);border-radius:999px;background:rgba(7,7,8,.9);font-size:11px;color:#f6d787;opacity:0;pointer-events:none}
.toast.show{animation:toast .8s ease}
@keyframes toast{0%{opacity:0}18%,72%{opacity:1;transform:translateX(-50%) translateY(0)}100%{opacity:0}}
@media(min-width:541px){.game{margin:12px auto;border-radius:20px;box-shadow:0 20px 60px #000;overflow:hidden}}
</style>
</head>

function updateDamage(){const pct=Math.min(100,hits*5.5);fill.style.width=pct+"%";const level=hits>=12?3:hits>=6?2:hits>=2?1:0;stage.classList.remove("damage1","damage2","damage3");if(level)stage.classList.add("damage"+level);[1,2,3].forEach(i=>markers[i].classList.toggle("active",i===Math.max(1,level)))}
function slap(side){const now=Date.now();combo=(now-lastHit<1500)?combo+1:1;lastHit=now;hits++;best=Math.max(best,combo);hitsEl.textContent=hits;comboEl.textContent=best;updateDamage();const hc=side==="left"?"hit-left":"hit-right",fc=side==="left"?"flash-left":"flash-right",pop=side==="left"?document.getElementById("popLeft"):document.getElementById("popRight");stage.classList.remove("hit-left","hit-right","flash-left","flash-right");void stage.offsetWidth;stage.classList.add(hc,fc);setTimeout(()=>stage.classList.remove(hc,fc),380);replay(pop,"go");replay(speech,"show");if(combo>=4){toast.textContent=combo+"x KOMBO!";replay(toast,"show")}if(navigator.vibrate)navigator.vibrate(combo>=6?[18,22,18]:18);clearTimeout(comboTimer);comboTimer=setTimeout(()=>{combo=0},1600)}
document.getElementById("leftSlap").addEventListener("click",()=>slap("left"));
document.getElementById("rightSlap").addEventListener("click",()=>slap("right"));
})();
</script>
