<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#030407">
  <title>Sonred Onur Tokatlama</title>
  <style>
    *{box-sizing:border-box}
    html,body{margin:0;background:#020305;color:#fff;font-family:system-ui,-apple-system,Segoe UI,sans-serif}
    body{min-height:100%;display:flex;justify-content:center}
    .game{width:min(100%,520px);padding:0;margin:0 auto}
    .stage{
      position:relative;
      width:100%;
      aspect-ratio:420/746;
      overflow:hidden;
      background:
        radial-gradient(circle at 25% 35%,rgba(255,79,24,.16),transparent 35%),
        radial-gradient(circle at 75% 35%,rgba(34,112,255,.16),transparent 35%),
        #07080b;
      touch-action:manipulation;
      user-select:none;
      -webkit-user-select:none;
    }
    .scene{
      position:absolute;inset:0;
      width:100%;height:100%;object-fit:cover;
      transform-origin:50% 42%;
      transition:filter .12s ease;
      pointer-events:none;
    }
    .scene.hit-left{animation:sceneLeft .34s cubic-bezier(.2,.9,.25,1)}
    .scene.hit-right{animation:sceneRight .34s cubic-bezier(.2,.9,.25,1)}
    @keyframes sceneLeft{
      0%,100%{transform:translateX(0) rotate(0)}
      30%{transform:translateX(2.2%) rotate(1.1deg)}
      62%{transform:translateX(-.8%) rotate(-.3deg)}
    }
    @keyframes sceneRight{
      0%,100%{transform:translateX(0) rotate(0)}
      30%{transform:translateX(-2.2%) rotate(-1.1deg)}
      62%{transform:translateX(.8%) rotate(.3deg)}
    }
    .loading{
      position:absolute;inset:0;display:grid;place-items:center;
      color:#c99b55;font-weight:800;font-size:13px;letter-spacing:.04em;
      background:linear-gradient(#0c0d10,#040506);
      z-index:2;
    }
    .loading.hidden{display:none}

    .tap{
      position:absolute;z-index:10;top:76.5%;height:22%;
      border:0;background:transparent;border-radius:20%;
      -webkit-tap-highlight-color:transparent;
      cursor:pointer;
    }
    .tap.left{left:1.2%;width:47.2%}
    .tap.right{right:1.2%;width:47.2%}
    .tap:focus-visible{outline:3px solid rgba(255,255,255,.8);outline-offset:-6px}
    .tap.left.pressed{background:radial-gradient(circle,rgba(255,79,23,.26),transparent 67%)}
    .tap.right.pressed{background:radial-gradient(circle,rgba(53,137,255,.26),transparent 67%)}

    .back{
      position:absolute;z-index:12;left:1.8%;top:1.1%;width:11%;aspect-ratio:1;
      border:0;border-radius:50%;background:transparent;
      text-indent:-9999px;overflow:hidden;
    }

    .speech{
      position:absolute;z-index:15;left:50%;top:27.5%;
      transform:translate(-50%,-8px) scale(.94);
      width:max-content;max-width:72%;
      padding:8px 11px;
      border:1px solid rgba(232,174,83,.9);
      border-radius:10px;
      background:rgba(10,9,8,.94);
      color:#ffe0a3;
      box-shadow:0 4px 16px rgba(0,0,0,.45);
      text-align:center;
      font-size:clamp(10px,3vw,15px);
      font-weight:850;
      opacity:0;pointer-events:none;
    }
    .speech.show{animation:speech .82s ease}
    .speech:after{
      content:"";position:absolute;left:50%;bottom:-5px;width:9px;height:9px;
      background:#0a0908;border-right:1px solid rgba(232,174,83,.9);
      border-bottom:1px solid rgba(232,174,83,.9);
      transform:translateX(-50%) rotate(45deg);
    }
    @keyframes speech{
      0%{opacity:0;transform:translate(-50%,5px) scale(.9)}
      14%,76%{opacity:1;transform:translate(-50%,0) scale(1)}
      100%{opacity:0;transform:translate(-50%,-7px) scale(.97)}
    }

    .impact{
      position:absolute;z-index:14;top:33%;font-size:clamp(27px,8vw,46px);
      opacity:0;pointer-events:none;filter:drop-shadow(0 0 8px rgba(255,191,72,.8));
    }
    .impact.left{left:31%}.impact.right{right:28%}
    .impact.pop{animation:impact .34s ease}
    @keyframes impact{
      0%{opacity:0;transform:scale(.25) rotate(-18deg)}
      38%{opacity:1;transform:scale(1.2) rotate(8deg)}
      100%{opacity:0;transform:scale(.75) rotate(0)}
    }

    .bruise{position:absolute;z-index:8;pointer-events:none;opacity:0;transition:opacity .2s}
    .bruise.a{
      left:46.6%;top:31.2%;width:5.2%;height:2.6%;border-radius:50%;
      background:radial-gradient(ellipse,rgba(76,28,90,.72),rgba(124,26,48,.28) 56%,transparent 76%);
      transform:rotate(-13deg);
    }
    .bruise.b{
      left:52.1%;top:31.8%;width:4.8%;height:2.5%;border-radius:50%;
      background:radial-gradient(ellipse,rgba(101,24,53,.72),rgba(75,32,91,.25) 58%,transparent 78%);
      transform:rotate(11deg);
    }
    .bruise.c{
      left:50.3%;top:34.4%;width:4.2%;height:.55%;
      background:rgba(128,24,29,.75);border-radius:999px;transform:rotate(-18deg);
    }
    .stage.damage-1 .bruise.a{opacity:.58}
    .stage.damage-2 .bruise.a,.stage.damage-2 .bruise.b{opacity:.76}
    .stage.damage-3 .bruise.a,.stage.damage-3 .bruise.b,.stage.damage-3 .bruise.c{opacity:.9}

    .status-frame{
      position:absolute;z-index:9;left:76.3%;width:21.8%;
      border:2px solid transparent;border-radius:5px;
      pointer-events:none;opacity:0;transition:.18s;
      box-shadow:0 0 14px transparent;
    }
    .status-frame.active{opacity:1;border-color:#ffd36d;box-shadow:0 0 12px rgba(255,179,50,.65)}
    .status-frame.normal{top:21.4%;height:13.9%}
    .status-frame.light{top:36.4%;height:14.4%}
    .status-frame.heavy{top:51.6%;height:14.7%}

    .num{
      position:absolute;z-index:11;left:20.7%;width:7.7%;
      display:grid;place-items:center;
      background:#151517;color:#fff;
      font-family:Georgia,serif;font-weight:900;
      font-size:clamp(13px,4vw,22px);
      line-height:1;border-radius:2px;
      pointer-events:none;
    }
    .num.hits{top:50.6%;height:3.3%}
    .num.combo{top:55.6%;height:3.3%}
    .damage-cover{
      position:absolute;z-index:11;left:6.2%;top:62.4%;width:19.7%;height:1.65%;
      background:#171719;border-radius:2px;overflow:hidden;pointer-events:none;
    }
    .damage-fill{
      height:100%;width:0%;
      background:linear-gradient(90deg,#ff2a17,#ff5b17 48%,#ffc03b);
      transition:width .18s ease;
    }
    .flash{
      position:absolute;z-index:13;inset:0;background:rgba(255,255,255,.14);
      opacity:0;pointer-events:none;
    }
    .flash.go{animation:flash .15s ease}
    @keyframes flash{0%{opacity:.6}100%{opacity:0}}

    .hint{
      position:absolute;z-index:12;left:50%;bottom:.6%;transform:translateX(-50%);
      color:rgba(255,255,255,.34);font-size:8px;letter-spacing:.06em;
      pointer-events:none;
    }
    @media (prefers-reduced-motion:reduce){
      .scene.hit-left,.scene.hit-right,.impact.pop,.speech.show,.flash.go{animation-duration:.01ms}
    }
  </style>
</head>
<body>
  <main class="game">
    <section id="stage" class="stage" aria-label="Sonred Onur Tokatlama oyunu">
      <div id="loading" class="loading">SAHNE YÜKLENİYOR…</div>
      <img id="scene" class="scene" alt="Sonred Onur Tokatlama oyun sahnesi">

      <a class="back" href="index.html" aria-label="Ana ekrana dön">Geri</a>

      <div id="speech" class="speech" aria-live="polite">Eren abi özür dilerim!</div>
      <div id="impactLeft" class="impact left">💥</div>
      <div id="impactRight" class="impact right">💥</div>
      <div class="bruise a"></div>
      <div class="bruise b"></div>
      <div class="bruise c"></div>
      <div id="flash" class="flash"></div>

      <div id="normalFrame" class="status-frame normal active"></div>
      <div id="lightFrame" class="status-frame light"></div>
      <div id="heavyFrame" class="status-frame heavy"></div>

      <div id="hitCount" class="num hits">0</div>
      <div id="comboCount" class="num combo">0</div>
      <div class="damage-cover"><div id="damageFill" class="damage-fill"></div></div>

      <button id="leftSlap" class="tap left" type="button" aria-label="Sol tokat"></button>
      <button id="rightSlap" class="tap right" type="button" aria-label="Sağ tokat"></button>
      <span class="hint">Butonlara dokun</span>
    </section>
  </main>

  <script>
  (() => {
    const stage=document.getElementById("stage");
    const scene=document.getElementById("scene");
    const loading=document.getElementById("loading");
    const speech=document.getElementById("speech");
    const hitCount=document.getElementById("hitCount");
    const comboCount=document.getElementById("comboCount");
    const damageFill=document.getElementById("damageFill");
    const flash=document.getElementById("flash");
    const normalFrame=document.getElementById("normalFrame");
    const lightFrame=document.getElementById("lightFrame");
    const heavyFrame=document.getElementById("heavyFrame");
    const left=document.getElementById("leftSlap");
    const right=document.getElementById("rightSlap");
    let hits=0,combo=0,comboTimer=0,animTimer=0;

    function b64ToBlobUrl(b64){
      const raw=atob(b64);
      const bytes=new Uint8Array(raw.length+2);
      for(let i=0;i<raw.length;i++) bytes[i]=raw.charCodeAt(i);
      bytes[raw.length]=0xff; bytes[raw.length+1]=0xd9;
      return URL.createObjectURL(new Blob([bytes],{type:"image/jpeg"}));
    }

    Promise.all([0,1,2,3,4].map(i=>
      fetch("assets/tokat-bg-"+String(i).padStart(2,"0")+".txt?v=20261003-stage1")
        .then(r=>{if(!r.ok)throw new Error("asset");return r.text()})
    )).then(parts=>{
      scene.onload=()=>loading.classList.add("hidden");
      scene.src=b64ToBlobUrl(parts.join("").trim());
    }).catch(()=>{
      loading.textContent="Sahne yüklenemedi. Sayfayı yenile.";
    });

    function restart(node,cls){
      node.classList.remove(cls); void node.offsetWidth; node.classList.add(cls);
    }
    function updateState(){
      const level=hits>=12?3:hits>=6?2:hits>=2?1:0;
      stage.classList.remove("damage-1","damage-2","damage-3");
      if(level)stage.classList.add("damage-"+level);
      normalFrame.classList.toggle("active",level===0);
      lightFrame.classList.toggle("active",level===1);
      heavyFrame.classList.toggle("active",level>=2);
      hitCount.textContent=String(hits);
      comboCount.textContent=String(combo);
      damageFill.style.width=Math.min(100,hits*7)+"%";
    }
    function slap(side){
      hits++; combo++;
      updateState();
      restart(speech,"show");
      restart(flash,"go");
      const impact=side==="left"?document.getElementById("impactLeft"):document.getElementById("impactRight");
      restart(impact,"pop");
      const cls=side==="left"?"hit-left":"hit-right";
      clearTimeout(animTimer);
      restart(scene,cls);
      animTimer=setTimeout(()=>scene.classList.remove(cls),370);

      const btn=side==="left"?left:right;
      btn.classList.add("pressed");
      setTimeout(()=>btn.classList.remove("pressed"),130);

      if(navigator.vibrate) navigator.vibrate(20);
      clearTimeout(comboTimer);
      comboTimer=setTimeout(()=>{combo=0;comboCount.textContent="0"},1700);
    }
    left.addEventListener("click",()=>slap("left"));
    right.addEventListener("click",()=>slap("right"));
  })();
  </script>
</body>
</html>
