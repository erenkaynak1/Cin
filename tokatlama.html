<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#050506"><title>Sonred Onur Tokatlama</title><style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;min-height:100%;background:#050506;color:#fff;font-family:system-ui,-apple-system,Segoe UI,sans-serif;overscroll-behavior:none}body{display:flex;justify-content:center}.game{position:relative;width:min(100vw,540px);min-height:100svh;background:#050506;overflow:hidden}.stage{position:relative;width:100%;aspect-ratio:220/391;overflow:hidden;background:#08090b;touch-action:manipulation}.art{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;transform-origin:50% 46%;will-change:transform,filter}.stage.hit-left .art{animation:hl .34s cubic-bezier(.18,.8,.22,1)}.stage.hit-right .art{animation:hr .34s cubic-bezier(.18,.8,.22,1)}@keyframes hl{0%,100%{transform:none}35%{transform:translateX(2.8%) rotate(1.8deg) scale(1.012)}68%{transform:translateX(-1.2%) rotate(-.7deg) scale(1.006)}}@keyframes hr{0%,100%{transform:none}35%{transform:translateX(-2.8%) rotate(-1.8deg) scale(1.012)}68%{transform:translateX(1.2%) rotate(.7deg) scale(1.006)}}.back{position:absolute;z-index:25;left:2.5%;top:2.1%;width:12%;aspect-ratio:1;border-radius:50%;background:transparent;color:transparent}.slap{position:absolute;z-index:25;bottom:2.1%;width:43%;height:18%;border:0;background:transparent;border-radius:50% 50% 18% 18%}.slap.left{left:2.5%}.slap.right{right:2.5%}.slap:active{background:radial-gradient(circle,rgba(255,255,255,.2),transparent 60%)}.speech{position:absolute;z-index:30;left:50%;top:28.5%;transform:translate(-50%,-8px) scale(.92);width:69%;padding:9px 12px;border:2px solid #f3be52;border-radius:13px;background:rgba(13,12,13,.94);box-shadow:0 0 22px rgba(255,116,35,.32);text-align:center;font-weight:900;font-size:clamp(13px,3.5vw,19px);color:#ffe2a2;opacity:0}.speech.show{animation:say .9s ease}@keyframes say{0%{opacity:0}12%,74%{opacity:1;transform:translate(-50%,0) scale(1)}100%{opacity:0;transform:translate(-50%,-10px) scale(.96)}}.pop{position:absolute;z-index:31;top:34%;font-size:clamp(30px,10vw,58px);font-weight:1000;opacity:0;text-shadow:0 3px #111,0 0 22px currentColor}.pop.l{left:20%;color:#ff5a32}.pop.r{right:20%;color:#4d9cff}.pop.go{animation:pop .36s ease}@keyframes pop{0%{opacity:0;transform:scale(.35)}42%{opacity:1;transform:scale(1.12) rotate(6deg)}100%{opacity:0;transform:scale(.84) translateY(-18px)}}.mask{position:absolute;z-index:12;background:#111;border-radius:3px}.val{position:absolute;z-index:13;font-family:Impact,Arial Black,sans-serif;text-align:center;color:#f4eee2;text-shadow:0 2px #000}.mh{left:18%;top:52.8%;width:9%;height:4.3%}.vh{left:18%;top:52.9%;width:9%;font-size:clamp(18px,5vw,31px)}.mc{left:18%;top:59.4%;width:9%;height:4.3%}.vc{left:18%;top:59.5%;width:9%;font-size:clamp(18px,5vw,31px)}.dmg{position:absolute;z-index:12;left:7.2%;top:66%;width:20%;height:1.5%;background:#111;border-radius:2px}.dmg i{display:block;height:100%;width:0;background:linear-gradient(90deg,#ff2a20,#ff6a1e,#ffd24a);box-shadow:0 0 8px #ff4c1c;transition:.18s}.mark{position:absolute;z-index:14;right:3.7%;width:22.6%;border:3px solid transparent;border-radius:8px;pointer-events:none}.m1{top:22.6%;height:14.9%}.m2{top:38.1%;height:15%}.m3{top:53.6%;height:15.2%}.mark.on{border-color:#ffd06c;box-shadow:0 0 18px rgba(255,164,52,.6)}.bruise{position:absolute;z-index:15;border-radius:50%;opacity:0;mix-blend-mode:multiply}.b1{left:46.8%;top:28.4%;width:4.5%;height:2.3%;background:#69244e}.b2{left:52.7%;top:30%;width:5%;height:2.5%;background:#7a2432}.b3{left:49.2%;top:31.5%;width:3.4%;height:1.2%;background:#8d241f}.d1 .b1{opacity:.35}.d2 .b1,.d2 .b2{opacity:.58}.d3 .b1,.d3 .b2,.d3 .b3{opacity:.78}@media(min-width:541px){.game{margin:12px auto;border-radius:20px;box-shadow:0 20px 60px #000}}
</style></head><body><main class="game"><section id="stage" class="stage"><img class="art" decoding="async" fetchpriority="high" alt="Sonred Onur Tokatlama" src="https://pikaso.cdnpk.net/private/production/5628204543/3678831222.png?token=exp=1791331200~hmac=fe4f1bedaf206a05d338836742799e80001ab3c0c1691a7b1862e10db3bd8035"><a class="back" href="index.html" aria-label="Ana ekrana dön">Geri</a><div id="speech" class="speech">Eren abi özür dilerim!</div><div id="pl" class="pop l">TOK!</div><div id="pr" class="pop r">ŞAK!</div><div class="mask mh"></div><div id="hits" class="val vh">0</div><div class="mask mc"></div><div id="best" class="val vc">0</div><div class="dmg"><i id="bar"></i></div><div id="m1" class="mark m1 on"></div><div id="m2" class="mark m2"></div><div id="m3" class="mark m3"></div><span class="bruise b1"></span><span class="bruise b2"></span><span class="bruise b3"></span><button id="left" class="slap left" aria-label="Sol tokat"></button><button id="right" class="slap right" aria-label="Sağ tokat"></button></section></main><script>
(()=>{const s=document.getElementById("stage"),sp=document.getElementById("speech"),h=document.getElementById("hits"),b=document.getElementById("best"),bar=document.getElementById("bar"),ms=[null,m1,m2,m3];let n=0,c=0,best=0,last=0,t;const replay=(e,x)=>{e.classList.remove(x);void e.offsetWidth;e.classList.add(x)};function upd(){bar.style.width=Math.min(100,n*5.5)+"%";const lv=n>=12?3:n>=6?2:n>=2?1:0;s.classList.remove("d1","d2","d3");if(lv)s.classList.add("d"+lv);[1,2,3].forEach(i=>ms[i].classList.toggle("on",i===Math.max(1,lv)))}function hit(side){const now=Date.now();c=now-last<1500?c+1:1;last=now;n++;best=Math.max(best,c);h.textContent=n;b.textContent=best;upd();const cls=side==="l"?"hit-left":"hit-right",p=side==="l"?pl:pr;s.classList.remove("hit-left","hit-right");void s.offsetWidth;s.classList.add(cls);setTimeout(()=>s.classList.remove(cls),380);replay(p,"go");replay(sp,"show");if(navigator.vibrate)navigator.vibrate(c>=6?[18,22,18]:18);clearTimeout(t);t=setTimeout(()=>c=0,1600)}left.onclick=()=>hit("l");right.onclick=()=>hit("r")})();
</script></body></html>
