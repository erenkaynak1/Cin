<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#09090b">
  <title>Sonred Onur Tokatlama</title>
  <style>
    *{box-sizing:border-box}html{background:#050506}body{margin:0;color:#f2eee9;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:
      radial-gradient(circle at 20% 20%,rgba(255,79,33,.16),transparent 25rem),
      radial-gradient(circle at 80% 20%,rgba(51,126,255,.15),transparent 25rem),
      linear-gradient(#101115,#050506 70%);min-height:100%}
    .wrap{width:min(100%,680px);margin:auto;padding:max(12px,env(safe-area-inset-top)) 12px calc(18px + env(safe-area-inset-bottom))}
    .top{display:grid;grid-template-columns:44px 1fr 44px;align-items:center;gap:8px}.back{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;border:1px solid #3f4248;background:#121318;color:#eee;text-decoration:none;font-size:28px}.title{text-align:center}.title h1{margin:0;font-family:Georgia,serif;font-size:clamp(28px,7vw,44px);letter-spacing:.03em;color:#e7ded2}.title h1 span{display:block;color:#ff4a2e;font:900 clamp(29px,8vw,48px)/.95 system-ui,sans-serif;transform:skew(-4deg)}.title p{margin:6px 0 0;color:#858991;font-size:11px}
    .hud{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}.hud>div{border:1px solid #333840;border-radius:10px;background:#0d0f12;padding:8px;text-align:center}.hud span{display:block;color:#7f848b;font-size:9px;text-transform:uppercase}.hud strong{display:block;margin-top:3px;font-size:19px}
    .arena{position:relative;min-height:620px;border:1px solid #2d3036;border-radius:18px;overflow:hidden;background:
      linear-gradient(90deg,rgba(255,87,31,.09),transparent 35%,transparent 65%,rgba(48,124,255,.09)),
      radial-gradient(circle at 50% 18%,rgba(255,255,255,.06),transparent 16rem),
      #090b0e}
    .arena:before{content:"";position:absolute;inset:auto 0 0;height:32%;background:linear-gradient(transparent,rgba(0,0,0,.72))}
    .speech{position:absolute;z-index:7;left:50%;top:12%;transform:translate(-50%,-8px) scale(.96);min-width:210px;max-width:78%;padding:11px 14px;border:1px solid #d8a24b;border-radius:12px;background:rgba(9,10,12,.96);color:#f1d189;text-align:center;font-weight:800;opacity:0;pointer-events:none}.speech.show{animation:speak .85s ease}.speech:after{content:"";position:absolute;left:50%;bottom:-8px;width:14px;height:14px;background:#090a0c;border-right:1px solid #d8a24b;border-bottom:1px solid #d8a24b;transform:translateX(-50%) rotate(45deg)}
    @keyframes speak{0%{opacity:0;transform:translate(-50%,3px) scale(.9)}15%,76%{opacity:1;transform:translate(-50%,0) scale(1)}100%{opacity:0;transform:translate(-50%,-7px) scale(.97)}}
    .character{position:absolute;left:50%;bottom:28px;width:255px;height:500px;transform:translateX(-50%);transform-origin:50% 82%;transition:filter .15s}.character.hit-left{animation:hitL .42s cubic-bezier(.2,.8,.2,1)}.character.hit-right{animation:hitR .42s cubic-bezier(.2,.8,.2,1)}
    @keyframes hitL{0%,100%{transform:translateX(-50%) rotate(0)}35%{transform:translateX(-40%) rotate(7deg)}65%{transform:translateX(-54%) rotate(-2deg)}}@keyframes hitR{0%,100%{transform:translateX(-50%) rotate(0)}35%{transform:translateX(-60%) rotate(-7deg)}65%{transform:translateX(-46%) rotate(2deg)}}
    .head{position:absolute;z-index:4;top:18px;left:50%;width:126px;height:136px;transform:translateX(-50%);border-radius:46% 46% 44% 44%;overflow:hidden;border:2px solid #3a2a20;background:#1a1513}.head img{width:100%;height:100%;object-fit:cover;filter:saturate(.9) contrast(1.02)}
    .bruise{position:absolute;z-index:6;border-radius:50%;opacity:0;mix-blend-mode:multiply;transition:opacity .15s}.bruise.one{width:34px;height:24px;left:17px;top:65px;background:rgba(89,31,75,.72);transform:rotate(-10deg)}.bruise.two{width:28px;height:20px;right:12px;top:72px;background:rgba(120,35,45,.65);transform:rotate(14deg)}.bruise.three{width:20px;height:10px;left:54px;top:101px;background:rgba(130,34,40,.7)}.damage-1 .bruise.one{opacity:.38}.damage-2 .bruise.one,.damage-2 .bruise.two{opacity:.58}.damage-3 .bruise.one,.damage-3 .bruise.two,.damage-3 .bruise.three{opacity:.78}
    .neck{position:absolute;top:136px;left:50%;width:46px;height:35px;background:#c8876d;transform:translateX(-50%);border-radius:10px}.torso{position:absolute;z-index:2;top:156px;left:50%;width:190px;height:210px;transform:translateX(-50%);border-radius:38px 38px 24px 24px;background:linear-gradient(90deg,#5d201d,#8d332e 50%,#4b1716);border:1px solid #7a3d35}.torso:before{content:"";position:absolute;inset:14px 52px 0;background:#121214;border-radius:10px 10px 20px 20px}.arm{position:absolute;z-index:1;top:180px;width:54px;height:205px;border-radius:28px;background:linear-gradient(#6f2a27,#421817);border:1px solid #6d3632}.arm.left{left:12px;transform:rotate(9deg)}.arm.right{right:12px;transform:rotate(-9deg)}.pants{position:absolute;z-index:1;left:50%;top:345px;width:162px;height:86px;transform:translateX(-50%);background:#17191d;border-radius:16px}.leg{position:absolute;bottom:0;width:67px;height:190px;background:linear-gradient(#1b1d21,#111215);border-radius:18px}.leg.left{left:50px;transform:rotate(2deg)}.leg.right{right:50px;transform:rotate(-2deg)}.shoe{position:absolute;bottom:-4px;width:77px;height:30px;background:#15100e;border-radius:16px 23px 10px 10px}.leg.left .shoe{left:-16px}.leg.right .shoe{right:-16px}
    .impact{position:absolute;z-index:8;font-size:48px;opacity:0;pointer-events:none}.impact.left{left:13%;top:38%}.impact.right{right:13%;top:38%}.impact.pop{animation:impact .38s ease}@keyframes impact{0%{opacity:0;transform:scale(.4) rotate(-15deg)}35%{opacity:1;transform:scale(1.2) rotate(8deg)}100%{opacity:0;transform:scale(.9) rotate(0)}}
    .controls{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}.slap{min-height:72px;border-radius:18px;border:2px solid;font-weight:900;font-size:18px;letter-spacing:.04em;color:#fff}.slap.left{border-color:#ff5b32;background:radial-gradient(circle at 50% 30%,#ff6d45,#a91f12)}.slap.right{border-color:#56a2ff;background:radial-gradient(circle at 50% 30%,#448fff,#153f91)}.slap:active{transform:translateY(2px) scale(.985)}.reset{display:block;margin:10px auto 0;border:1px solid #3b3f45;border-radius:999px;background:#111319;color:#999;padding:8px 14px;font-size:11px}
    .bar{height:8px;margin-top:5px;border-radius:999px;background:#22262c;overflow:hidden}.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#f0bf4d,#f05a2c);transition:width .2s}
    footer{text-align:center;color:#494d53;font-size:10px;padding-top:10px}
    @media(max-width:420px){.arena{min-height:570px}.character{transform:translateX(-50%) scale(.88);transform-origin:50% 100%;bottom:10px}.character.hit-left{animation:hitLs .42s cubic-bezier(.2,.8,.2,1)}.character.hit-right{animation:hitRs .42s cubic-bezier(.2,.8,.2,1)}@keyframes hitLs{0%,100%{transform:translateX(-50%) scale(.88) rotate(0)}35%{transform:translateX(-40%) scale(.88) rotate(7deg)}65%{transform:translateX(-54%) scale(.88) rotate(-2deg)}}@keyframes hitRs{0%,100%{transform:translateX(-50%) scale(.88) rotate(0)}35%{transform:translateX(-60%) scale(.88) rotate(-7deg)}65%{transform:translateX(-46%) scale(.88) rotate(2deg)}}}
  </style>
</head>

          <span class="bruise one"></span>
          <span class="bruise two"></span>
          <span class="bruise three"></span>
        </div>
        <div class="torso"></div>
        <div class="pants"></div>
        <div class="leg left"><span class="shoe"></span></div>
        <div class="leg right"><span class="shoe"></span></div>
      </div>
    </section>

    <div class="controls">
      <button id="leftSlap" class="slap left" type="button">✋ SOL TOKAT</button>
      <button id="rightSlap" class="slap right" type="button">SAĞ TOKAT 🤚</button>
    </div>
    <button id="resetGame" class="reset" type="button">Sıfırla</button>
    <footer>By SPQR-Eren</footer>
  </main>

  <script>
    (() => {
      const character = document.getElementById("character");
      const head = document.getElementById("head");
      const speech = document.getElementById("speech");
      const hitCount = document.getElementById("hitCount");
      const comboCount = document.getElementById("comboCount");
      const damageBar = document.getElementById("damageBar");
      const impactLeft = document.getElementById("impactLeft");
      const impactRight = document.getElementById("impactRight");
      let hits = 0;
      let combo = 0;
      let comboTimer = 0;

      function restartClass(node, cls){
        node.classList.remove(cls);
        void node.offsetWidth;
        node.classList.add(cls);
      }

      function updateDamage(){
        const stage = hits >= 12 ? 3 : hits >= 7 ? 2 : hits >= 3 ? 1 : 0;
        head.classList.remove("damage-1","damage-2","damage-3");
        if(stage) head.classList.add("damage-" + stage);
        damageBar.style.width = Math.min(100, hits * 6) + "%";
      }

      function saySorry(){
        speech.textContent = "Eren abi özür dilerim!";
        restartClass(speech, "show");
      }

      function slap(side){
        hits += 1;
        combo += 1;
        hitCount.textContent = String(hits);
        comboCount.textContent = String(combo);
        updateDamage();
        saySorry();

        const cls = side === "left" ? "hit-left" : "hit-right";
        restartClass(character, cls);
        setTimeout(() => character.classList.remove(cls), 440);

        const impact = side === "left" ? impactLeft : impactRight;
        restartClass(impact, "pop");

        clearTimeout(comboTimer);
        comboTimer = setTimeout(() => {
          combo = 0;
          comboCount.textContent = "0";
        }, 1800);
      }

      document.getElementById("leftSlap").addEventListener("click", () => slap("left"));
      document.getElementById("rightSlap").addEventListener("click", () => slap("right"));
      document.getElementById("resetGame").addEventListener("click", () => {
        hits = 0; combo = 0;
        hitCount.textContent = "0";
        comboCount.textContent = "0";
        head.classList.remove("damage-1","damage-2","damage-3");
        damageBar.style.width = "0%";
        speech.classList.remove("show");
      });
    })();
  </script>
</body>
