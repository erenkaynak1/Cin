<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#07090b"><title>Askerî Envanter</title><link rel="stylesheet" href="styles.css?v=army1">
<style>
.army-shell{width:min(100%,900px);margin:auto;padding:max(10px,env(safe-area-inset-top)) 10px 24px}.army-top{display:grid;grid-template-columns:42px 1fr 42px;align-items:center;text-align:center;padding:8px 0 14px}.army-top h1{margin:0;color:#ead9b7;font-size:clamp(23px,6vw,38px)}.army-top p{margin:5px 0 0;color:#92969b;font:11px system-ui}.army-summary{padding:14px;border:1px solid #a98545;border-radius:12px;background:linear-gradient(145deg,#211a10,#0b0d0f);text-align:center}.army-summary span,.army-summary small{display:block;color:#b9a77e;font:10px system-ui}.army-summary strong{display:block;color:#f0d07d;font:800 clamp(30px,8vw,48px) system-ui}.army-add{display:grid;grid-template-columns:1fr auto;gap:8px;margin-top:12px;padding:10px;border:1px solid #554323;border-radius:11px;background:#0b0d0f}.army-add input{min-width:0;height:43px;padding:0 11px;background:#06080a;color:white;border:1px solid #444;border-radius:7px}.army-add button,.army-save{border:1px solid #c79542;border-radius:7px;background:linear-gradient(#efd17b,#ba8128);color:#201407;font-weight:800;padding:0 12px}.army-status{min-height:26px;padding:7px 2px;text-align:center;color:#8c9197;font:10px system-ui}.error{color:#e78a82}.ok{color:#78cf91}.army-list{display:grid;gap:11px}.army-player{overflow:hidden;border:1px solid #8b672e;border-radius:12px;background:#090b0d}.army-player-head,.army-player-foot{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 12px}.army-player-head{border-bottom:1px solid #49381e}.army-player-head strong{color:#eee2ca;font-size:17px}.army-player-head small{color:#8e9297;font:9px system-ui}.army-units{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;padding:9px}.army-unit{overflow:hidden;border:1px solid #72572e;border-radius:8px;background:#080a0c}.army-art{height:clamp(92px,25vw,150px);background-image:var(--army-sprite);background-repeat:no-repeat;background-size:600% 100%;background-position:var(--x) center}.army-unit-name{display:grid;place-items:center;min-height:25px;color:#eee6d8;font:600 11px system-ui}.army-unit input{width:calc(100% - 10px);height:35px;margin:4px 5px 6px;background:#030405;color:white;border:1px solid #444;border-radius:6px;text-align:center;font-weight:bold}.army-player-foot{border-top:1px solid #49381e}.army-player-total{color:#a7a9aa;font:10px system-ui}.army-player-total b{color:#f0d07d;font-size:14px}.army-save{min-height:36px}.army-empty{text-align:center;padding:25px;color:#85898e;border:1px dashed #72572e;border-radius:10px}.army-footnote{text-align:center;color:#686d72;font:9px/1.45 system-ui;margin-top:14px}@media(min-width:650px){.army-units{grid-template-columns:repeat(6,minmax(0,1fr))}.army-art{height:130px}}
</style></head>
<body class="sim-body"><main class="army-shell">
<header class="army-top"><a class="back-link" href="index.html">‹</a><div><h1>ASKERÎ ENVANTER</h1><p>İttifakın toplam askerî gücü</p></div><span></span></header>
<section class="army-summary"><span>TOPLAM ASKERÎ BİRİM</span><strong id="grandTotal">0</strong><small id="playerCount">0 kayıtlı oyuncu</small></section>
<form id="addPlayerForm" class="army-add"><input id="playerName" maxlength="60" autocomplete="off" placeholder="Oyuncu adını gir"><button id="addPlayerButton">OYUNCU EKLE</button></form>
<div id="armyStatus" class="army-status">Envanter yükleniyor…</div><section id="armyList" class="army-list"></section>
<p class="army-footnote">Oyuncu kayıtları kalıcıdır. Asker sayılarını değiştirip KAYDET'e bas. Kayıtlar silinmez.</p><footer>By SPQR-Eren</footer></main>
<script>
(()=>{const API="https://layfxnbzavpxmzisghif.supabase.co/functions/v1/army-inventory",KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxheWZ4bmJ6YXZweG16aGlmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE4MDA0MDMsImV4cCI6MjEwNzM3NjQwM30.b0uD9rnIza3eD4dKkjwqIk44lzbc45kJyjSrOaFsWWo",U=[["kemankes","Kemankeş"],["tapukci","Tapukçi"],["mavi_kurt","Mavi Kurt"],["muhafiz","Muhafız"],["mavi_atli","Mavi Atlı"],["kursad","Kürşad"]],$=id=>document.getElementById(id),list=$("armyList"),status=$("armyStatus");let players=[];const fmt=n=>Number(n||0).toLocaleString("tr-TR"),esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));function say(t,c=""){status.textContent=t;status.className="army-status "+c}async function api(body){let r=await fetch(API,{method:body?"POST":"GET",headers:{"apikey":KEY,"Authorization":"Bearer "+KEY,"Content-Type":"application/json"},...(body?{body:JSON.stringify(body)}:{})}),d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||"Sunucu hatası");return d}function render(){let total=players.reduce((s,p)=>s+U.reduce((n,[k])=>n+Number(p[k]||0),0),0);$("grandTotal").textContent=fmt(total);$("playerCount").textContent=players.length+" kayıtlı oyuncu";if(!players.length){list.innerHTML='<div class="army-empty">Henüz oyuncu eklenmemiş.</div>';return}list.innerHTML=players.map(p=>'<article class="army-player"><header class="army-player-head"><strong>'+esc(p.player_name)+'</strong><small>'+new Date(p.updated_at||p.created_at).toLocaleString("tr-TR")+'</small></header><div class="army-units">'+U.map(([k,n],i)=>'<label class="army-unit"><div class="army-art" style="--x:'+(i*20)+'%"></div><span class="army-unit-name">'+n+'</span><input type="number" min="0" step="1" inputmode="numeric" data-unit="'+k+'" value="'+Number(p[k]||0)+'"></label>').join("")+'</div><footer class="army-player-foot"><span class="army-player-total">Oyuncu toplamı: <b>'+fmt(U.reduce((s,[k])=>s+Number(p[k]||0),0))+'</b></span><button class="army-save" data-save="'+p.id+'" type="button">KAYDET</button></footer></article>').join("")}async function load(){try{players=(await api()).players||[];render();say("")}catch(e){say(e.message,"error")}}$("addPlayerForm").addEventListener("submit",async e=>{e.preventDefault();let b=$("addPlayerButton"),name=$("playerName").value.trim();if(name.length<2)return say("Oyuncu adı en az 2 karakter olmalı.","error");b.disabled=true;try{await api({action:"add_player",player_name:name});$("playerName").value="";say("Oyuncu kaydedildi.","ok");await load()}catch(e){say(e.message,"error")}finally{b.disabled=false}});list.addEventListener("click",async e=>{let b=e.target.closest("[data-save]");if(!b)return;let card=b.closest(".army-player"),counts={};for(let x of card.querySelectorAll("[data-unit]")){let v=Number(x.value);if(!Number.isSafeInteger(v)||v<0||v>1000000000)return say("Geçerli, sıfır veya daha büyük tam sayı gir.","error");counts[x.dataset.unit]=v}b.disabled=true;try{await api({action:"update_player",player_id:b.dataset.save,counts});say("Asker sayıları güncellendi.","ok");await load()}catch(e){say(e.message,"error");b.disabled=false}});fetch("assets/army-sprite.b64").then(r=>r.text()).then(b=>document.documentElement.style.setProperty("--army-sprite",'url("data:image/webp;base64,'+b.trim()+'")')).catch(()=>say("Asker görselleri yüklenemedi.","error"));load()})();
</script></body></html>
