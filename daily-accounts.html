<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#07090b">
  <title>Günlük Liste · HERKES CİN GİBİ</title>
  <style>
    :root{--bg:#07090b;--panel:#111419;--line:rgba(214,174,92,.34);--gold:#d4ad63;--text:#ecebea;--muted:#8d9298;--green:#55c579;--red:#e35f58}
    *{box-sizing:border-box}html{background:#000}body{margin:0;min-height:100%;color:var(--text);font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:radial-gradient(circle at 50% 0,rgba(132,91,43,.17),transparent 28rem),linear-gradient(#111418,#090b0d 36rem,#050607)}
    .shell{width:min(100%,680px);margin:auto;padding:max(12px,env(safe-area-inset-top)) 12px calc(24px + env(safe-area-inset-bottom))}
    .head{display:grid;grid-template-columns:44px 1fr 44px;align-items:center;gap:8px;text-align:center}.back{width:42px;height:42px;border:1px solid rgba(255,255,255,.14);border-radius:50%;display:grid;place-items:center;color:#ddd;text-decoration:none;background:rgba(255,255,255,.035);font:32px/1 system-ui}.head h1{margin:0;color:#d7d7d7;font-family:Georgia,"Times New Roman",serif;font-size:clamp(24px,7vw,38px);letter-spacing:.04em}.sub{margin:5px 0 0;color:var(--muted);font-size:11px}
    .summary{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:14px 0 9px;padding:10px 12px;border:1px solid rgba(214,174,92,.22);border-radius:10px;background:#0b0d0f;color:#969ba0;font-size:11px}.summary strong{color:#d8c27c;font-size:13px}
    .toolbar{display:grid;grid-template-columns:1fr auto;gap:8px}.add{display:grid;grid-template-columns:1fr auto;gap:8px;padding:10px;border:1px solid var(--line);border-radius:12px;background:rgba(10,12,14,.96)}.add input{min-width:0;height:44px;border:1px solid rgba(255,255,255,.14);border-radius:8px;background:#06080a;color:#fff;padding:0 12px;font-size:15px;outline:none}.add input:focus{border-color:rgba(212,173,99,.65);box-shadow:0 0 0 2px rgba(212,173,99,.12)}.add button{height:44px;padding:0 15px;border:1px solid #c49949;border-radius:8px;background:linear-gradient(#e2c16c,#a97929);color:#1c150a;font-weight:800}.reset{min-height:64px;padding:0 13px;border:1px solid rgba(227,95,88,.55);border-radius:12px;background:linear-gradient(180deg,rgba(98,28,27,.88),rgba(54,18,18,.96));color:#ffaaa5;font-weight:850;font-size:11px}.reset:active{transform:translateY(1px)}
    .status{min-height:26px;padding:8px 2px 5px;color:#8c9197;font-size:10px;text-align:center}.status.error{color:#e78a82}.status.ok{color:#78cf91}
    .list{display:grid;gap:8px}.row{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:10px;padding:10px 11px;border:1px solid rgba(214,174,92,.27);border-radius:12px;background:rgba(9,11,13,.97)}.name{min-width:0;color:#eee4d2;font-family:Georgia,"Times New Roman",serif;font-size:17px;font-weight:700;overflow-wrap:anywhere}.went{min-height:42px;min-width:118px;padding:0 11px;border:1px solid rgba(74,191,109,.55);border-radius:9px;background:linear-gradient(180deg,rgba(30,88,48,.8),rgba(18,49,28,.92));color:#96e8ad;font-weight:850;font-size:11px}.went.active{background:linear-gradient(180deg,rgba(52,138,78,.96),rgba(25,78,42,.98));color:#d7ffe1;box-shadow:inset 0 0 0 2px rgba(255,255,255,.12)}.went:disabled{opacity:.52}.empty{padding:26px 10px;text-align:center;color:#777c82;border:1px dashed rgba(214,174,92,.22);border-radius:12px;font-size:12px}footer{text-align:right;color:#555a60;padding:18px 2px 0;font-family:Georgia,serif;font-size:11px}
    @media(max-width:480px){.toolbar{grid-template-columns:1fr}.reset{min-height:43px}.add{grid-template-columns:1fr}.add button{width:100%}.row{gap:7px}.name{font-size:15px}.went{min-width:108px;font-size:10px}}
  </style>
</head>
<body>
<main class="shell">
  <header class="head">
    <a class="back" href="index.html" aria-label="Ana ekrana dön">‹</a>
    <div><h1>GÜNLÜK LİSTE</h1><p class="sub">Bugün gidilen hesapları tek tek işaretle.</p></div>
    <span></span>
  </header>

  <section class="summary">
    <span>Bugünkü durum</span>
    <strong id="summaryCount">0 / 0</strong>
  </section>

  <div class="toolbar">
    <form id="addForm" class="add">
      <input id="nameInput" maxlength="60" autocomplete="off" placeholder="Oyuncu / hesap adı ekle" aria-label="Hesap adı">
      <button id="addButton" type="submit">EKLE</button>
    </form>
    <button id="resetButton" class="reset" type="button">GÜNLÜĞÜ SIFIRLA</button>
  </div>

  <div id="status" class="status" role="status" aria-live="polite"></div>
  <section id="list" class="list" aria-label="Günlük hesap listesi"></section>
  <footer>By SPQR-Eren</footer>
</main>

<script>
(() => {
  const API_BASE = "https://layfxnbzavpxmzisghif.supabase.co/functions/v1/empty-accounts";
  const list = document.getElementById("list");
  const status = document.getElementById("status");
  const form = document.getElementById("addForm");
  const input = document.getElementById("nameInput");
  const addButton = document.getElementById("addButton");
  const resetButton = document.getElementById("resetButton");
  const summaryCount = document.getElementById("summaryCount");

  const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));
  const setStatus = (text, type="") => { status.textContent=text; status.className="status"+(type?" "+type:""); };

  function render(entries){
    const done=(entries||[]).filter(e=>e.went_today).length;
    summaryCount.textContent=done+" / "+(entries||[]).length;

    if(!entries?.length){
      list.innerHTML='<div class="empty">Henüz günlük listeye hesap eklenmemiş.</div>';
      return;
    }

    list.innerHTML=entries.map(e =>
      '<article class="row">'+
        '<div class="name">'+esc(e.name)+'</div>'+
        '<button type="button" class="went '+(e.went_today?"active":"")+'" data-id="'+esc(e.id)+'" data-went="'+(e.went_today?"1":"0")+'">'+
          (e.went_today?'✓ BUGÜN GİTTİM':'BUGÜN GİTTİM')+
        '</button>'+
      '</article>'
    ).join("");
  }

  async function request(path="", options={}){
    const res=await fetch(API_BASE+path,{...options,headers:{"Content-Type":"application/json",...(options.headers||{})}});
    const data=await res.json().catch(()=>({}));
    if(!res.ok) throw new Error(data.error||"İşlem başarısız.");
    return data;
  }

  async function load(){
    setStatus("Liste yükleniyor…");
    try{
      const data=await request("?mode=daily");
      render(data.entries||[]);
      setStatus("");
    }catch(err){
      setStatus(err.message,"error");
      render([]);
    }
  }

  form.addEventListener("submit", async e => {
    e.preventDefault();
    const name=input.value.trim().replace(/\s+/g," ");
    if(name.length<2){ setStatus("En az 2 karakter gir.","error"); return; }
    addButton.disabled=true;
    try{
      await request("",{method:"POST",body:JSON.stringify({action:"daily_add",name})});
      input.value="";
      setStatus("Listeye eklendi.","ok");
      await load();
    }catch(err){ setStatus(err.message,"error"); }
    finally{ addButton.disabled=false; }
  });

  list.addEventListener("click", async e => {
    const btn=e.target.closest("button[data-id]");
    if(!btn||btn.disabled)return;
    const next=btn.dataset.went!=="1";
    btn.disabled=true;
    try{
      await request("",{method:"POST",body:JSON.stringify({action:"daily_mark",entry_id:btn.dataset.id,went_today:next})});
      setStatus(next?"Bugün gittim olarak işaretlendi.":"İşaret kaldırıldı.","ok");
      await load();
    }catch(err){ setStatus(err.message,"error"); btn.disabled=false; }
  });

  resetButton.addEventListener("click", async () => {
    if(!confirm("Bugün Gittim işaretlerinin tamamı kaldırılsın mı?")) return;
    resetButton.disabled=true;
    try{
      await request("",{method:"POST",body:JSON.stringify({action:"daily_reset"})});
      setStatus("Günlük işaretler sıfırlandı.","ok");
      await load();
    }catch(err){ setStatus(err.message,"error"); }
    finally{ resetButton.disabled=false; }
  });

  load();
})();
</script>
</body>
</html>
