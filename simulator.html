<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#07090b">
  <title>Savaş Simülatörü · HERKES CİN GİBİ</title>
  <link rel="stylesheet" href="styles.css?v=20261002-reportcards2">
</head>
<body class="sim-body">
  <main class="sim-shell">
    <header class="sim-header">
      <a class="back-link" href="index.html" aria-label="Ana ekrana dön">‹</a>
      <div>
        <h1>SAVAŞ SİMÜLATÖRÜ</h1>
        <p>Asker sayılarını gir ve savaş sonucunu gör.</p>
      </div>
      <span></span>
    </header>

    <section class="battle-grid">
      <section class="side attacker">
        <div class="side-head">
          <strong>SALDIRAN</strong>
          <select id="attackerNation" aria-label="Saldıran ulus">
            <option value="gokturk">Göktürk</option>
            <option value="selcuk">Selçuk</option>
            <option value="hun">Hun</option>
          </select>
        </div>
        <div class="unit-grid" id="attackerUnits"></div>
      </section>

      <section class="side defender">
        <div class="side-head">
          <strong>SAVUNAN</strong>
          <select id="defenderNation" aria-label="Savunan ulus">
            <option value="gokturk">Göktürk</option>
            <option value="selcuk">Selçuk</option>
            <option value="hun">Hun</option>
          </select>
        </div>
        <div class="unit-grid" id="defenderUnits"></div>
        <label class="wall-control" for="wallLevel">
          <span>Sur Seviyesi</span>
          <select id="wallLevel" aria-label="Sur Seviyesi">
            <option value="0">0</option>
            <option value="1">1</option>
            <option value="2">2</option>
            <option value="3">3</option>
            <option value="4">4</option>
            <option value="5">5</option>
            <option value="6">6</option>
            <option value="7">7</option>
            <option value="8">8</option>
            <option value="9">9</option>
            <option value="10">10</option>
          </select>
        </label>
      </section>
    </section>

    <div class="simulate-panel">
      <button id="simulateButton" class="simulate-button" type="button">⚔ SİMÜLE ET</button>
      <p id="validationMessage" class="validation" role="status" aria-live="polite"></p>
    </div>

    <section class="results" id="results" aria-live="polite">
      <h2>SAVAŞ SONUCU</h2>
      <div class="winner" id="winnerText">İki tarafa da en az bir asker gir.</div>
      <div class="report-wrap">
        <section class="battle-report attacker-report">
          <div class="report-head">
            <span class="report-side-title">SALDIRAN</span>
          </div>
          <div class="report-units" id="attackerResults"></div>
        </section>
        <section class="battle-report defender-report">
          <div class="report-head">
            <span class="report-side-title">SAVUNAN</span>
          </div>
          <div class="report-units" id="defenderResults"></div>
        </section>
      </div>
    </section>

    <footer>By SPQR-Eren</footer>
  </main>
  <script src="app-v2.js?v=20261002-reportcards2"></script>
</body>
</html>
